<script>
(() => {
  const root = document.getElementById('vocab-layout-review');
  const screenshots = JSON.parse(document.getElementById('vocab-layout-review-images').textContent);
  const state = { view: '手机正面' };
  function render() {
    for (const img of root.querySelectorAll('img[data-design]')) {
      const design = img.dataset.design;
      img.src = screenshots[design][state.view];
      img.alt = `${img.closest('[data-variant]').dataset.variant} · ${state.view} · 真实布局原型截图`;
    }
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSelect(state, 'view', { label: '查看场景', options: ['手机正面', '手机背面', '桌面背面'], reference: 'vocab-layout.view' });
  }
})();
</script>
