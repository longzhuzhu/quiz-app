# Alembic 配置文件

[alembic]
# 路径配置
script_location = alembic

# 数据库连接（由 env.py 从 .env/settings 自动覆盖，此处仅为占位）
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder

# 模板
# file_template = %%(rev)s_%%(slug)s

# 时区
# timezone =

# truncate_slug_length = 40

# 版本路径分隔符
# version_path_separator = os

# 输出编码
# output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
